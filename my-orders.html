<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - EatLo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff6b35;
            --primary-dark: #e55a2b;
            --secondary: #1a1a2e;
            --success: #06d6a0;
            --warning: #ffd166;
            --danger: #ef476f;
            --info: #118ab2;
            --light: #f8f9fa;
            --dark: #0f0f1a;
            --white: #ffffff;
            --gray: #6c757d;
            --gradient-primary: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            --shadow-sm: 0 5px 20px rgba(0, 0, 0, 0.08);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.4s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            min-height: 100vh;
        }

        /* Navbar */
        nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        .logo {
            font-weight: 900;
            font-size: 1.8rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: var(--gradient-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
        }

        .logo-text {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            background: var(--light);
            color: var(--secondary);
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn:hover {
            background: var(--gradient-primary);
            color: white;
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .page-header p {
            color: var(--gray);
        }

        /* Search Section */
        .search-section {
            background: var(--white);
            padding: 35px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 30px;
        }

        .search-section h3 {
            margin-bottom: 20px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-section h3 i {
            color: var(--primary);
        }

        .search-form {
            display: flex;
            gap: 15px;
        }

        .search-form input {
            flex: 1;
            padding: 18px 25px;
            border: 2px solid var(--light);
            border-radius: 50px;
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
        }

        .search-form input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-form button {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-form button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        /* Orders Section */
        .orders-section {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .orders-header {
            background: var(--gradient-primary);
            color: white;
            padding: 25px 30px;
        }

        .orders-header h3 {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .orders-list {
            padding: 25px;
        }

        /* Order Card */
        .order-card {
            background: var(--light);
            border-radius: var(--radius-sm);
            padding: 30px;
            margin-bottom: 20px;
            transition: var(--transition);
            animation: slideIn 0.4s ease;
            border-left: 5px solid var(--primary);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .order-card:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-sm);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .order-id {
            font-weight: 700;
            color: var(--secondary);
            font-size: 1.2rem;
        }

        .order-date {
            color: var(--gray);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .order-status {
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-confirmed {
            background: #e0f2fe;
            color: #0277bd;
        }

        .status-preparing {
            background: #fff3e0;
            color: #ef6c00;
        }

        .status-onway {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-delivered {
            background: #e8f5e9;
            color: var(--success);
        }

        .status-cancelled {
            background: #ffebee;
            color: #c62828;
        }

        /* Order Progress */
        .order-progress {
            display: flex;
            justify-content: space-between;
            margin: 30px 0;
            position: relative;
        }

        .order-progress::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 10%;
            right: 10%;
            height: 4px;
            background: #e0e0e0;
            z-index: 0;
            border-radius: 10px;
        }

        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .progress-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-bottom: 10px;
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .progress-step.active .progress-icon {
            background: var(--success);
            box-shadow: 0 5px 20px rgba(6, 214, 160, 0.4);
        }

        .progress-step.current .progress-icon {
            background: var(--warning);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .progress-label {
            font-size: 0.8rem;
            color: var(--gray);
            text-align: center;
        }

        .progress-step.active .progress-label,
        .progress-step.current .progress-label {
            color: var(--secondary);
            font-weight: 600;
        }

        /* Order Items */
        .order-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .order-item-tag {
            background: var(--white);
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }

        .order-item-tag i {
            color: var(--primary);
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
        }

        .order-address {
            color: var(--gray);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 60%;
        }

        .order-address i {
            color: var(--success);
            font-size: 1.2rem;
        }

        .order-total {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--primary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
            background: var(--light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state-icon i {
            font-size: 3.5rem;
            color: #ddd;
        }

        .empty-state h3 {
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--gray);
            margin-bottom: 30px;
        }

        .empty-state a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gradient-primary);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        .empty-state a:hover {
            transform: translateY(-3px);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .search-form {
                flex-direction: column;
            }

            .order-header {
                flex-direction: column;
            }

            .order-footer {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .order-address {
                max-width: 100%;
            }

            .order-progress {
                display: none;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="logo">
            <div class="logo-icon">
                <i class="fas fa-bowl-food"></i>
            </div>
            <span class="logo-text">EatLo</span>
        </a>
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Menu
        </a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>📦 My Orders</h1>
            <p>Track your orders and view order history</p>
        </div>

        <div class="search-section">
            <h3><i class="fas fa-search"></i> Find Your Orders</h3>
            <div class="search-form">
                <input type="tel" id="phone-input" placeholder="Enter your phone number" maxlength="10">
                <button onclick="searchOrders()">
                    <i class="fas fa-search"></i> Find Orders
                </button>
            </div>
        </div>

        <div class="orders-section">
            <div class="orders-header">
                <h3><i class="fas fa-history"></i> Your Order History</h3>
            </div>
            <div class="orders-list" id="orders-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA9ow668puMztfqJcfAHkJcXXBlWjWFIx8",
            authDomain: "eatlo-ec2f6.firebaseapp.com",
            projectId: "eatlo-ec2f6",
            storageBucket: "eatlo-ec2f6.firebasestorage.app",
            messagingSenderId: "298601218259",
            appId: "1:298601218259:web:d8b54f5322139f42881426"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Pre-fill phone if available
        const savedPhone = localStorage.getItem('customerPhone') || '';
        document.getElementById('phone-input').value = savedPhone;

        // ========== SEARCH ORDERS (FROM FIREBASE) ==========
        async function searchOrders() {
            const phone = document.getElementById('phone-input').value.trim();
            if (!phone) {
                alert('Please enter your phone number');
                return;
            }

            // Save phone locally for convenience
            localStorage.setItem('customerPhone', phone);

            // Query Firestore
            // Note: Composite index might be required for 'phone' + 'createdAt'. 
            // If query fails, check console for index creation link.
            const ordersRef = collection(db, "orders");
            const q = query(
                ordersRef,
                where("phone", "==", phone),
                orderBy("createdAt", "desc")
            );

            try {
                const querySnapshot = await getDocs(q);
                const myOrders = [];
                querySnapshot.forEach((doc) => {
                    // Include the document ID in the order object
                    myOrders.push({ id: doc.id, ...doc.data() });
                });
                renderOrders(myOrders);
            } catch (e) {
                console.error("Error fetching orders:", e);
                // Fallback: If index is missing or error occurs, try local storage just in case (optional)
                // or just alert user.
                alert("Could not fetch orders. If this is your first time, the database might be building an index. Check console.");
            }
        }

        // ========== RENDER ORDERS ==========
        function renderOrders(orders) {
            const container = document.getElementById('orders-list');

            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <i class="fas fa-box-open"></i>
                        </div>
                        <h3>No Orders Found</h3>
                        <p>We couldn't find any orders with this phone number</p>
                        <a href="index.html"><i class="fas fa-utensils"></i> Order Now</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(order => {
                const statusClass = getStatusClass(order.status);
                const progressSteps = getProgressSteps(order.status);
                const itemsList = order.items.map(item =>
                    `<span class="order-item-tag">
                        <i class="fas fa-utensils"></i>
                        ${item.name} x${item.quantity || 1}
                    </span>`
                ).join('');

                // Use Firestore ID (often long string) or a shorter display ID if available
                const displayId = order.id.length > 10 ? '...' + order.id.slice(-6) : order.id;

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <div class="order-id">Order ID: ${displayId}</div>
                                <div class="order-date"><i class="far fa-clock"></i> ${order.date}</div>
                            </div>
                            <span class="order-status ${statusClass}">${order.status}</span>
                        </div>
                        ${progressSteps}
                        <div class="order-items">${itemsList}</div>
                        <div class="order-footer">
                            <div class="order-address">
                                <i class="fas fa-map-marker-alt"></i>
                                ${order.address.substring(0, 50)}...
                            </div>
                            <div class="order-total">₹${order.total}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getStatusClass(status) {
            const classes = {
                'Confirmed': 'status-confirmed',
                'Preparing': 'status-preparing',
                'On the Way': 'status-onway',
                'Delivered': 'status-delivered',
                'Cancelled': 'status-cancelled'
            };
            return classes[status] || 'status-confirmed';
        }

        function getProgressSteps(status) {
            const steps = ['Confirmed', 'Preparing', 'On the Way', 'Delivered'];
            const currentIndex = steps.indexOf(status);
            if (status === 'Cancelled') return '';

            const icons = {
                'Confirmed': 'fa-check',
                'Preparing': 'fa-fire',
                'On the Way': 'fa-motorcycle',
                'Delivered': 'fa-home'
            };

            return `
                <div class="order-progress">
                    ${steps.map((step, index) => {
                let className = '';
                if (index < currentIndex) className = 'active';
                else if (index === currentIndex) className = 'current';
                return `
                            <div class="progress-step ${className}">
                                <div class="progress-icon"><i class="fas ${icons[step]}"></i></div>
                                <span class="progress-label">${step}</span>
                            </div>
                        `;
            }).join('')}
                </div>
            `;
        }

        // Show empty state initially
        if (savedPhone) {
            searchOrders();
        } else {
            document.getElementById('orders-list').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">
                        <i class="fas fa-search"></i>
                    </div>
                    <h3>Enter Your Phone Number</h3>
                    <p>Search with your phone number to see your orders</p>
                </div>
            `;
        }

        // Expose function to window
        window.searchOrders = searchOrders;
    </script>

</body>

</html>
