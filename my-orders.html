<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - EatLo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff6b35;
            --secondary: #1a1a2e;
            --success: #06d6a0;
            --warning: #ffd166;
            --danger: #ef476f;
            --info: #118ab2;
            --light: #f8f9fa;
            --white: #ffffff;
            --gray: #6c757d;
            --gradient-primary: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            --shadow-sm: 0 5px 20px rgba(0, 0, 0, 0.07);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.4s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            overflow-x: hidden;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            min-height: 100vh;
        }

        nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        .logo {
            font-weight: 900;
            font-size: 1.8rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: var(--gradient-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
        }

        .logo-text {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-btn {
            background: var(--light);
            color: var(--secondary);
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn:hover {
            background: var(--gradient-primary);
            color: white;
            transform: translateY(-2px);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header h1 {
            font-size: 2.5rem;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .page-header p {
            color: var(--gray);
        }

        /* Search */
        .search-section {
            background: var(--white);
            padding: 35px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 30px;
        }

        .search-section h3 {
            margin-bottom: 20px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-section h3 i {
            color: var(--primary);
        }

        .search-form {
            display: flex;
            gap: 15px;
        }

        .search-form input {
            flex: 1;
            padding: 18px 25px;
            border: 2px solid var(--light);
            border-radius: 50px;
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
        }

        .search-form input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
        }

        .search-form button {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-form button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        /* Orders */
        .orders-section {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .orders-header {
            background: var(--gradient-primary);
            color: white;
            padding: 25px 30px;
        }

        .orders-header h3 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
        }

        .orders-list {
            padding: 25px;
        }

        /* Order Card */
        .order-card {
            background: var(--light);
            border-radius: var(--radius-sm);
            padding: 28px;
            margin-bottom: 20px;
            transition: var(--transition);
            animation: slideIn 0.4s ease;
            border-left: 5px solid var(--primary);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .order-card:last-child {
            margin-bottom: 0;
        }

        .order-card:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-sm);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .order-id {
            font-weight: 700;
            color: var(--secondary);
            font-size: 1.1rem;
        }

        .order-date {
            color: var(--gray);
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .order-status {
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .status-confirmed {
            background: #e0f2fe;
            color: #0277bd;
        }

        .status-preparing {
            background: #fff3e0;
            color: #ef6c00;
        }

        .status-onway {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-delivered {
            background: #e8f5e9;
            color: var(--success);
        }

        .status-cancelled {
            background: #ffebee;
            color: #c62828;
        }

        /* Progress Tracker */
        .order-progress {
            display: flex;
            justify-content: space-between;
            margin: 25px 0;
            position: relative;
        }

        .order-progress::before {
            content: '';
            position: absolute;
            top: 27px;
            left: 8%;
            right: 8%;
            height: 4px;
            background: #e0e0e0;
            z-index: 0;
            border-radius: 10px;
        }

        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            flex: 1;
        }

        .progress-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin-bottom: 10px;
            font-size: 1.2rem;
            transition: var(--transition);
        }

        .progress-step.active .progress-icon {
            background: var(--success);
            box-shadow: 0 5px 20px rgba(6, 214, 160, 0.35);
        }

        .progress-step.current .progress-icon {
            background: var(--warning);
            color: var(--secondary);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .progress-label {
            font-size: 0.78rem;
            color: var(--gray);
            text-align: center;
        }

        .progress-step.active .progress-label,
        .progress-step.current .progress-label {
            color: var(--secondary);
            font-weight: 600;
        }

        /* Order Items */
        .order-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .order-item-tag {
            background: var(--white);
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
        }

        .order-item-tag i {
            color: var(--primary);
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px dashed #ddd;
            flex-wrap: wrap;
            gap: 12px;
        }

        .order-address {
            color: var(--gray);
            font-size: 0.88rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 60%;
        }

        .order-address i {
            color: var(--success);
            font-size: 1.1rem;
            margin-top: 2px;
            flex-shrink: 0;
        }

        .order-total {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--primary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 70px 20px;
        }

        .empty-state-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
            background: var(--light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state-icon i {
            font-size: 3.5rem;
            color: #ddd;
        }

        .empty-state h3 {
            color: var(--secondary);
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .empty-state p {
            color: var(--gray);
            margin-bottom: 30px;
        }

        .empty-state a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--gradient-primary);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        .empty-state a:hover {
            transform: translateY(-3px);
        }

        /* Loading */
        .loading-state {
            text-align: center;
            padding: 50px 20px;
        }

        .loading-state i {
            font-size: 2.5rem;
            color: var(--primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .loading-state p {
            margin-top: 15px;
            color: var(--gray);
        }

        @media (max-width: 600px) {
            .search-form {
                flex-direction: column;
            }

            .search-form button {
                justify-content: center;
            }

            .order-header {
                flex-direction: column;
            }

            .order-footer {
                flex-direction: column;
            }

            .order-address {
                max-width: 100%;
            }

            .order-progress {
                display: none;
            }

            .page-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="logo">
            <div class="logo-icon"><i class="fas fa-bowl-food"></i></div>
            <span class="logo-text">EatLo</span>
        </a>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Menu</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>📦 My Orders</h1>
            <p>Track your orders and view order history</p>
        </div>

        <div class="search-section">
            <h3><i class="fas fa-search"></i> Find Your Orders</h3>
            <div class="search-form">
                <input type="tel" id="phone-input" placeholder="Enter your 10-digit phone number" maxlength="10"
                    oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                    onkeypress="if(event.key==='Enter') searchOrders()">
                <button onclick="searchOrders()">
                    <i class="fas fa-search"></i> Find Orders
                </button>
            </div>
        </div>

        <div class="orders-section">
            <div class="orders-header">
                <h3><i class="fas fa-history"></i> Your Order History</h3>
            </div>
            <div class="orders-list" id="orders-list">
                <div class="empty-state">
                    <div class="empty-state-icon"><i class="fas fa-search"></i></div>
                    <h3>Enter your phone number</h3>
                    <p>We'll find all orders placed with that number.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9ow668puMztfqJcfAHkJcXXBlWjWFIx8",
            authDomain: "eatlo-ec2f6.firebaseapp.com",
            projectId: "eatlo-ec2f6",
            storageBucket: "eatlo-ec2f6.firebasestorage.app",
            messagingSenderId: "298601218259",
            appId: "1:298601218259:web:d8b54f5322139f42881426"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const savedPhone = localStorage.getItem('customerPhone') || '';
        if (savedPhone) {
            document.getElementById('phone-input').value = savedPhone;
        }

        window.searchOrders = async function () {
            const phone = document.getElementById('phone-input').value.trim();
            const container = document.getElementById('orders-list');

            if (!/^[6-9]\d{9}$/.test(phone)) {
                alert('Please enter a valid 10-digit Indian mobile number');
                return;
            }

            localStorage.setItem('customerPhone', phone);

            container.innerHTML = `
                <div class="loading-state">
                    <i class="fas fa-circle-notch"></i>
                    <p>Searching for your orders...</p>
                </div>
            `;

            try {
                // Phone can be saved as 10 digits or with +91, so check both formats.
                const phoneVariants = [phone, '+91' + phone];
                let snapshot;
                try {
                    snapshot = await db.collection("orders")
                        .where("phone", "in", phoneVariants)
                        .orderBy("createdAt", "desc")
                        .get();
                } catch (indexErr) {
                    console.warn("Index/order issue, fetching without order:", indexErr.message);
                    snapshot = await db.collection("orders")
                        .where("phone", "in", phoneVariants)
                        .get();
                }

                if (snapshot.empty) {
                    renderEmpty();
                    return;
                }

                const orders = snapshot.docs.map(doc => ({ docId: doc.id, ...doc.data() }));
                orders.sort((a, b) => getOrderTime(b) - getOrderTime(a));
                renderOrders(orders);

            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="fas fa-exclamation-triangle"></i></div>
                        <h3>Search Error</h3>
                        <p>Could not load orders right now. Please check Firebase rules/index and try again.</p>
                    </div>
                `;
            }
        };

        function getOrderTime(order) {
            const t = order.createdAt || order.timestamp || order.date;
            if (t && typeof t.toMillis === 'function') return t.toMillis();
            if (t && typeof t.seconds === 'number') return t.seconds * 1000;
            const parsed = Date.parse(t || '');
            return Number.isFinite(parsed) ? parsed : 0;
        }

        function formatOrderDate(order) {
            const t = order.createdAt || order.timestamp;
            if (t && typeof t.toDate === 'function') return t.toDate().toLocaleString('en-IN');
            if (t && typeof t.seconds === 'number') return new Date(t.seconds * 1000).toLocaleString('en-IN');
            return order.date || 'Recently placed';
        }

        function normalizeStatus(status) {
            if (status === 'Picked Up') return 'On the Way';
            if (status === 'Assigned') return 'Confirmed';
            return status || 'Confirmed';
        }

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>'"]/g, function (ch) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[ch];
            });
        }

        function renderOrders(orders) {
            const container = document.getElementById('orders-list');
            container.innerHTML = orders.map(function (order) {
                const status = normalizeStatus(order.status);
                const statusClass = getStatusClass(status);
                const progressHtml = getProgressHtml(status);

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <div class="order-id">Order #${escapeHtml((order.docId || '').slice(-8).toUpperCase())}</div>
                                <div class="order-date"><i class="far fa-clock"></i> ${escapeHtml(formatOrderDate(order))}</div>
                            </div>
                            <span class="order-status ${statusClass}">${escapeHtml(status)}</span>
                        </div>

                        ${progressHtml}

                        <div class="order-items">
                            ${(order.items || []).map(function (item) {
                    return '<span class="order-item-tag"><i class="fas fa-utensils"></i> ' + escapeHtml(item.name || 'Item') + ' x' + escapeHtml(item.quantity || 1) + '</span>';
                }).join('')}
                        </div>

                        <div class="order-footer">
                            <div class="order-address">
                                <i class="fas fa-map-marker-alt"></i>
                                <span>${escapeHtml(order.address || 'Delivery address')}</span>
                            </div>
                            <div class="order-total">₹${escapeHtml(order.total || 0)}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderEmpty() {
            document.getElementById('orders-list').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon"><i class="fas fa-box-open"></i></div>
                    <h3>No Orders Found</h3>
                    <p>No orders found for this phone number. Try a different number.</p>
                    <a href="index.html"><i class="fas fa-utensils"></i> Order Now</a>
                </div>
            `;
        }

        function getStatusClass(status) {
            var map = {
                'Confirmed': 'status-confirmed',
                'Preparing': 'status-preparing',
                'On the Way': 'status-onway',
                'Delivered': 'status-delivered',
                'Cancelled': 'status-cancelled'
            };
            return map[status] || 'status-confirmed';
        }

        function getProgressHtml(status) {
            if (status === 'Cancelled') return '';
            var steps = ['Confirmed', 'Preparing', 'On the Way', 'Delivered'];
            var icons = ['fa-check', 'fa-fire', 'fa-motorcycle', 'fa-home'];
            var currentIndex = steps.indexOf(status);
            if (currentIndex === -1) currentIndex = 0;

            return '<div class="order-progress">' +
                steps.map(function (step, i) {
                    var cls = '';
                    if (i < currentIndex) cls = 'active';
                    else if (i === currentIndex) cls = 'current';
                    return '<div class="progress-step ' + cls + '">' +
                        '<div class="progress-icon"><i class="fas ' + icons[i] + '"></i></div>' +
                        '<span class="progress-label">' + step + '</span>' +
                        '</div>';
                }).join('') +
                '</div>';
        }

        // Auto-search if phone saved
        if (savedPhone) {
            window.searchOrders();
        }
    </script>
</body>

</html>
