<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed - EatLo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff6b35;
            --success: #06d6a0;
            --secondary: #1a1a2e;
            --light: #f8f9fa;
            --white: #ffffff;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .success-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 60px 50px;
            text-align: center;
            max-width: 550px;
            width: 100%;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-icon {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, var(--success), #05c793);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: bounce 0.6s ease 0.3s;
            box-shadow: 0 15px 40px rgba(6, 214, 160, 0.4);
        }

        @keyframes bounce {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .success-icon i {
            font-size: 4rem;
            color: white;
        }

        h1 {
            color: var(--secondary);
            margin-bottom: 15px;
            font-size: 2rem;
        }

        .order-id {
            background: var(--light);
            display: inline-block;
            padding: 15px 35px;
            border-radius: 50px;
            margin: 20px 0;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            letter-spacing: 1px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.7;
        }

        .info-box {
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 35px;
            text-align: left;
        }

        .info-box h4 {
            color: var(--success);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }

        .info-box p {
            margin: 0;
            font-size: 0.95rem;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #f7931e);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--secondary);
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        /* Confetti */
        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1000;
        }

        .confetti-piece {
            position: absolute;
            width: 12px;
            height: 24px;
            top: -30px;
            animation: confetti-fall 4s ease-in-out forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="confetti" id="confetti"></div>

    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>

        <h1>Order Placed Successfully! 🎉</h1>

        <div class="order-id" id="order-id">#ELO123456</div>

        <p>Thank you for ordering from EatLo! Your delicious food is being prepared and will be delivered soon.</p>

        <div class="info-box">
            <h4><i class="fas fa-clock"></i> Estimated Delivery Time</h4>
            <p>Your order will arrive in approximately <strong>30-45 minutes</strong>. You'll receive updates on your
                phone.</p>
        </div>

        <div class="buttons">
            <a href="my-orders.html" class="btn btn-primary">
                <i class="fas fa-clipboard-list"></i> Track Order
            </a>
            <a href="index.html" class="btn btn-secondary">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>

    <script>
        // Get Order ID from URL
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('id');
        if (orderId) {
            document.getElementById('order-id').innerText = '#' + orderId;
        }

        // Create Confetti
        function createConfetti() {
            const container = document.getElementById('confetti');
            const colors = ['#ff6b35', '#06d6a0', '#ffd166', '#118ab2', '#ef476f', '#f7931e'];

            for (let i = 0; i < 60; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = Math.random() * 3 + 's';
                piece.style.animationDuration = (Math.random() * 2 + 3) + 's';
                container.appendChild(piece);
            }
        }

        createConfetti();
    </script>

</body>

</html>
