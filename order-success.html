<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed - EatLo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff6b35;
            --success: #06d6a0;
            --secondary: #1a1a2e;
            --light: #f8f9fa;
            --white: #ffffff;
            --gray: #6c757d;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            --radius: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            /* Removes blue highlight on mobile tap */
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            /* Using dvh (dynamic viewport height) for better mobile browser support */
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            overflow-x: hidden;
            /* Prevent horizontal scroll from confetti */
        }

        .success-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px 20px;
            /* Reduced padding for mobile */
            text-align: center;
            max-width: 580px;
            width: 100%;
            position: relative;
            z-index: 10;
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Success Icon - Scaled for mobile */
        .success-icon {
            width: clamp(100px, 20vw, 140px);
            height: clamp(100px, 20vw, 140px);
            background: linear-gradient(135deg, var(--success), #05c793);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 0 10px 30px rgba(6, 214, 160, 0.4);
            animation: bounce 0.6s ease 0.4s both;
        }

        @keyframes bounce {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            60% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon i {
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: white;
        }

        h1 {
            color: var(--secondary);
            margin-bottom: 12px;
            font-size: clamp(1.4rem, 5vw, 2rem);
            font-weight: 800;
            line-height: 1.2;
        }

        .order-id {
            background: #fff5f0;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 50px;
            margin: 15px 0;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--primary);
            letter-spacing: 1px;
            border: 1px solid rgba(255, 107, 53, 0.2);
        }

        .subtitle {
            color: var(--gray);
            margin-bottom: 30px;
            line-height: 1.6;
            font-size: clamp(0.85rem, 3vw, 1rem);
            padding: 0 10px;
        }

        /* Delivery Steps - Improved for small screens */
        .delivery-steps {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 30px;
            width: 100%;
        }

        .step {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .step-icon {
            width: clamp(45px, 12vw, 55px);
            height: clamp(45px, 12vw, 55px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1rem, 4vw, 1.3rem);
            transition: all 0.3s ease;
        }

        .step:nth-child(1) .step-icon {
            background: #e3f2fd;
            color: #1976d2;
        }

        .step:nth-child(2) .step-icon {
            background: #fff3e0;
            color: #f57c00;
        }

        .step:nth-child(3) .step-icon {
            background: #e8f5e9;
            color: var(--success);
        }

        .step span {
            font-size: clamp(0.65rem, 2.5vw, 0.78rem);
            color: var(--gray);
            font-weight: 600;
            white-space: nowrap;
        }

        /* Info Box */
        .info-box {
            background: #f1f8e9;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
            border-left: 4px solid var(--success);
        }

        .info-box h4 {
            color: #2e7d32;
            margin-bottom: 8px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-box p {
            color: var(--gray);
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* Buttons - Stack on very small screens */
        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-direction: row;
        }

        @media (max-width: 400px) {
            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        .btn {
            padding: 14px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.2);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--secondary);
        }

        .countdown {
            margin-top: 25px;
            font-size: 0.8rem;
            color: var(--gray);
        }

        /* Confetti */
        .confetti {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .confetti-piece {
            position: absolute;
            top: -20px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(105vh) rotate(720deg) translateX(var(--drift));
                opacity: 0;
            }
        }

        /* Large Screen Adjustments */
        @media (min-width: 768px) {
            .success-card {
                padding: 60px 50px;
            }

            .buttons {
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="confetti" id="confetti"></div>

    <div class="success-card">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>

        <h1>Order Confirmed!</h1>

        <div class="order-id" id="order-id">Loading...</div>

        <p class="subtitle">
            Thanks for choosing <strong>EatLo</strong>!<br>
            Chef is already working their magic.
        </p>

        <div class="delivery-steps">
            <div class="step">
                <div class="step-icon"><i class="fas fa-check-circle"></i></div>
                <span>Confirmed</span>
            </div>
            <div class="step">
                <div class="step-icon"><i class="fas fa-fire"></i></div>
                <span>Cooking</span>
            </div>
            <div class="step">
                <div class="step-icon"><i class="fas fa-motorcycle"></i></div>
                <span>Shipping</span>
            </div>
        </div>

        <div class="info-box">
            <h4><i class="fas fa-clock"></i> ETA: 30–45 Mins</h4>
            <p>We'll notify you as soon as the rider picks up your meal!</p>
        </div>

        <div class="buttons">
            <a href="my-orders.html" class="btn btn-primary">
                <i class="fas fa-map-marker-alt"></i> Track Order
            </a>
            <a href="index.html" class="btn btn-secondary">
                <i class="fas fa-home"></i> Home
            </a>
        </div>

        <div class="countdown">
            Auto-redirect in <span id="countdown">10</span>s
        </div>
    </div>

    <script>
        // Handle Order ID
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('id');
        const orderIdEl = document.getElementById('order-id');
        orderIdEl.innerText = orderId ? '#' + orderId.toUpperCase() : '#ELO' + Math.floor(100000 + Math.random() * 900000);

        // Responsive Confetti
        function createConfetti() {
            const container = document.getElementById('confetti');
            const colors = ['#ff6b35', '#06d6a0', '#ffd166', '#118ab2'];
            const count = window.innerWidth < 500 ? 40 : 80; // Fewer pieces on mobile for performance

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.width = Math.random() * 8 + 4 + 'px';
                piece.style.height = Math.random() * 15 + 5 + 'px';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                piece.style.animationDelay = Math.random() * 2 + 's';
                piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
                piece.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
                container.appendChild(piece);
            }
        }

        createConfetti();

        // Redirect timer
        let count = 10;
        const countEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            count--;
            countEl.innerText = count;
            if (count <= 0) {
                clearInterval(timer);
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>

</html>
