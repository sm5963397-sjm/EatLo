<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - EatLo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff6b35;
            --secondary: #1a1a2e;
            --light: #f8f9fa;
            --gray: #6c757d;
            --danger: #ef476f;
            --white: #ffffff;
            --gradient-primary: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
            position: relative;
            overflow: hidden;
        }

        /* Decorative background blobs */
        body::before {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255,107,53,0.15) 0%, transparent 70%);
            top: -150px; right: -150px;
            border-radius: 50%;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(247,147,30,0.1) 0%, transparent 70%);
            bottom: -100px; left: -100px;
            border-radius: 50%;
        }

        .login-card {
            background: var(--white);
            padding: 50px 45px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 430px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-icon {
            width: 80px; height: 80px;
            background: var(--gradient-primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.2rem;
            color: white;
            box-shadow: 0 10px 30px rgba(255,107,53,0.35);
        }

        .brand-name {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--secondary);
            letter-spacing: -0.5px;
        }
        .brand-name span { color: var(--primary); }

        .subtitle {
            color: var(--gray);
            font-size: 0.88rem;
            margin: 6px 0 32px;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #bbb;
            font-size: 0.95rem;
            transition: var(--transition);
            pointer-events: none;
        }

        input {
            width: 100%;
            padding: 15px 16px 15px 46px;
            border: 2px solid #eee;
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--secondary);
            transition: var(--transition);
            background: #fafafa;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255,107,53,0.08);
        }

        input:focus ~ i,
        .input-wrapper:focus-within i {
            color: var(--primary);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #bbb;
            cursor: pointer;
            font-size: 0.95rem;
            pointer-events: all;
            transition: var(--transition);
        }
        .password-toggle:hover { color: var(--primary); }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255,107,53,0.4);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-box {
            display: none;
            background: rgba(239,71,111,0.08);
            border: 1px solid rgba(239,71,111,0.25);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-top: 16px;
            color: var(--danger);
            font-size: 0.85rem;
            font-weight: 500;
            text-align: left;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 24px;
            color: var(--gray);
            font-size: 0.85rem;
            text-decoration: none;
            transition: var(--transition);
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-icon"><i class="fas fa-bowl-food"></i></div>
        <h1 class="brand-name">Eat<span>Lo</span> Admin</h1>
        <p class="subtitle">Sign in to access your dashboard</p>

        <form id="login-form" autocomplete="off">
            <div class="input-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="admin@eatlo.in" required autocomplete="username">
                    <i class="fas fa-envelope"></i>
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    <i class="fas fa-lock"></i>
                    <i class="fas fa-eye password-toggle" id="pw-toggle" onclick="togglePassword()"></i>
                </div>
            </div>

            <button type="submit" class="login-btn" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>

            <div class="error-box" id="error-box">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-text">Invalid email or password.</span>
            </div>
        </form>

        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to website
        </a>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9ow668puMztfqJcfAHkJcXXBlWjWFIx8",
            authDomain: "eatlo-ec2f6.firebaseapp.com",
            projectId: "eatlo-ec2f6",
            storageBucket: "eatlo-ec2f6.firebasestorage.app",
            messagingSenderId: "298601218259",
            appId: "1:298601218259:web:d8b54f5322139f42881426"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // If already logged in, go straight to dashboard
        auth.onAuthStateChanged(user => {
            if (user) window.location.replace('admin.html');
        });

        // Toggle password visibility
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('pw-toggle');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Login form submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn      = document.getElementById('login-btn');
            const errorBox = document.getElementById('error-box');
            const errorTxt = document.getElementById('error-text');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            errorBox.style.display = 'none';

            try {
                await auth.signInWithEmailAndPassword(email, password);
                // onAuthStateChanged above handles redirect
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                errorTxt.textContent = getErrorMessage(err.code);
                errorBox.style.display = 'flex';
            }
        });

        function getErrorMessage(code) {
            switch (code) {
                case 'auth/invalid-credential':
                case 'auth/wrong-password':
                case 'auth/user-not-found':
                case 'auth/invalid-email':
                    return 'Invalid email or password. Please try again.';
                case 'auth/too-many-requests':
                    return 'Too many failed attempts. Please wait and try again later.';
                case 'auth/network-request-failed':
                    return 'Network error. Check your internet connection.';
                default:
                    return 'Something went wrong. Please try again.';
            }
        }
    </script>
</body>
</html>
