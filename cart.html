<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your Cart - EatLo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff6b35;
            --primary-dark: #e55a2b;
            --secondary: #1a1a2e;
            --success: #06d6a0;
            --warning: #ffd166;
            --danger: #ef476f;
            --light: #f8f9fa;
            --white: #ffffff;
            --gray: #6c757d;
            --gradient-primary: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            --gradient-secondary: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            --shadow-sm: 0 5px 20px rgba(0, 0, 0, 0.07);
            --shadow-primary: 0 10px 40px rgba(255, 107, 53, 0.3);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            min-height: 100vh;
        }

        nav {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        .logo {
            font-weight: 900;
            font-size: 1.5rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--gradient-primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: var(--shadow-primary);
        }

        .logo-text {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-btn {
            background: var(--light);
            color: var(--secondary);
            padding: 10px 18px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 15px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-header h1 {
            font-size: 2.2rem;
            color: var(--secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .page-header h1 i {
            color: var(--primary);
        }

        .page-header p {
            color: var(--gray);
            font-size: 1rem;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            align-items: start;
        }

        .cart-section,
        .order-summary {
            background: var(--white);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow-sm);
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--secondary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--light);
        }

        .item-count {
            background: var(--light);
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            color: var(--gray);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid var(--light);
        }

        .item-image {
            width: 80px;
            height: 80px;
            border-radius: 15px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .item-details {
            flex: 1;
        }

        .item-details h4 {
            font-size: 1rem;
            color: var(--secondary);
        }

        .item-details .item-price {
            color: var(--primary);
            font-weight: 700;
            display: block;
            margin-top: 4px;
        }

        .item-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--light);
            padding: 6px 12px;
            border-radius: 50px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: var(--white);
            border-radius: 50%;
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .remove-btn {
            border: none;
            background: #fee2e2;
            color: var(--danger);
            width: 35px;
            height: 35px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            color: var(--gray);
            font-size: 0.95rem;
        }

        .summary-row.total {
            border-top: 2px dashed var(--light);
            margin-top: 15px;
            padding-top: 15px;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--secondary);
        }

        .summary-row.total span:last-child {
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--secondary);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--light);
            border-radius: var(--radius-sm);
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
        }

        .location-btn {
            width: 100%;
            background: #06d6a0;
            color: white;
            border: none;
            padding: 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .checkout-btn {
            width: 100%;
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            box-shadow: var(--shadow-primary);
        }

        .clear-btn {
            width: 100%;
            background: transparent;
            color: var(--danger);
            border: 2px solid var(--danger);
            padding: 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-top: 10px;
            font-weight: 600;
        }

        /* MOBILE CENTERING FIX */
        @media (max-width: 992px) {
            .cart-layout {
                grid-template-columns: 1fr;
                /* Stacks vertically */
                max-width: 600px;
                /* Limits width to keep it centered */
                margin: 0 auto;
                /* Centers the whole block */
            }

            .page-header h1 {
                font-size: 1.8rem;
            }

            .order-summary {
                position: static;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px 10px;
            }

            .cart-item {
                gap: 12px;
            }

            .item-image {
                width: 65px;
                height: 65px;
            }

            .item-details h4 {
                font-size: 0.9rem;
            }

            .qty-control {
                padding: 4px 8px;
            }

            .qty-btn {
                width: 24px;
                height: 24px;
            }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            left: 20px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            z-index: 9999;
            transform: translateY(-100px);
            transition: 0.4s;
            text-align: center;
            border-left: 5px solid var(--success);
        }

        .toast.show {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="toast" id="toast">
        <span id="toast-message"></span>
    </div>

    <nav>
        <a href="index.html" class="logo">
            <div class="logo-icon"><i class="fas fa-bowl-food"></i></div>
            <span class="logo-text">EatLo</span>
        </a>
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Menu</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1><i class="fas fa-shopping-bag"></i> Your Cart</h1>
            <p>Ready for a delicious meal?</p>
        </div>

        <div class="cart-layout">
            <div class="cart-section">
                <div class="section-title">
                    <span>Items</span>
                    <span class="item-count" id="item-count">0 items</span>
                </div>
                <div id="cart-items"></div>
            </div>

            <div class="order-summary">
                <div class="section-title">Order Summary</div>
                <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
                <div class="summary-row"><span>Delivery Fee</span><span id="delivery-fee">₹40</span></div>

                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total-price">₹0</span>
                </div>

                <div style="margin: 20px 0; height: 1px; background: #eee;"></div>

                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="name" placeholder="Full Name">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="10 Digit Number" maxlength="10">
                </div>
                <button class="location-btn" onclick="getLocation()">
                    <i class="fas fa-location-arrow"></i> Use Location
                </button>
                <div class="form-group">
                    <label>Delivery Address</label>
                    <textarea id="address" placeholder="House No, Street, Landmark..."></textarea>
                </div>

                <button class="checkout-btn" id="checkout-btn" onclick="placeOrder()">
                    Place Order Securely
                </button>
                <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA9ow668puMztfqJcfAHkJcXXBlWjWFIx8",
            authDomain: "eatlo-ec2f6.firebaseapp.com",
            projectId: "eatlo-ec2f6",
            storageBucket: "eatlo-ec2f6.firebasestorage.app",
            messagingSenderId: "298601218259",
            appId: "1:298601218259:web:d8b54f5322139f42881426"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const deliveryFee = 40;

        function renderCart() {
            const container = document.getElementById('cart-items');
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 40px 0;"><i class="fas fa-shopping-basket" style="font-size: 3rem; color: #eee; margin-bottom: 15px;"></i><p>Your cart is empty</p></div>';
                document.getElementById('checkout-btn').disabled = true;
            } else {
                document.getElementById('checkout-btn').disabled = false;
                cart.forEach((item, index) => {
                    const qty = item.quantity || 1;
                    container.innerHTML += `
                        <div class="cart-item">
                            <div class="item-image" style="background-image: url('${item.image || ''}')"></div>
                            <div class="item-details">
                                <h4>${item.name}</h4>
                                <span class="item-price">₹${item.price * qty}</span>
                            </div>
                            <div class="item-actions">
                                <div class="qty-control">
                                    <button class="qty-btn" onclick="updateQty(${index}, -1)">−</button>
                                    <span style="font-weight:700;">${qty}</span>
                                    <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                                </div>
                                <button class="remove-btn" onclick="removeItem(${index})"><i class="fas fa-trash-can"></i></button>
                            </div>
                        </div>
                    `;
                });
            }
            updateTotals();
        }

        window.updateQty = (index, change) => {
            cart[index].quantity = (cart[index].quantity || 1) + change;
            if (cart[index].quantity <= 0) cart.splice(index, 1);
            saveAndRender();
        };

        window.removeItem = (index) => {
            cart.splice(index, 1);
            saveAndRender();
            showToast('Item removed');
        };

        window.clearCart = () => {
            if (confirm('Clear entire cart?')) {
                cart = [];
                saveAndRender();
            }
        };

        function saveAndRender() {
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        function updateTotals() {
            let subtotal = cart.reduce((sum, item) => sum + item.price * (item.quantity || 1), 0);
            const fee = cart.length > 0 ? deliveryFee : 0;
            const total = subtotal + fee;

            document.getElementById('item-count').innerText = cart.length + ' items';
            document.getElementById('subtotal').innerText = '₹' + subtotal;
            document.getElementById('total-price').innerText = '₹' + total;
        }

        window.getLocation = () => {
            if (!navigator.geolocation) return showToast('Not supported');
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('address').value = `GPS: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
                showToast('Location Fixed! 📍');
            });
        };

        window.placeOrder = async () => {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();

            if (!name || phone.length < 10 || !address) return showToast('Please fill all details', 'error');

            const btn = document.getElementById('checkout-btn');
            btn.disabled = true;
            btn.innerText = 'Processing...';

            let subtotal = cart.reduce((sum, item) => sum + item.price * (item.quantity || 1), 0);

            const order = {
                name, phone, address, items: cart,
                subtotal, total: subtotal + deliveryFee,
                status: 'Confirmed',
                date: new Date().toLocaleString()
            };

            try {
                const doc = await db.collection("orders").add(order);
                localStorage.removeItem('cart');
                showToast('Order Success! 🎉');
                setTimeout(() => window.location.href = 'order-success.html?id=' + doc.id, 1500);
            } catch (e) {
                showToast('Error placing order', 'error');
                btn.disabled = false;
            }
        };

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.borderLeftColor = type === 'error' ? '#ef476f' : '#06d6a0';
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        renderCart();
    </script>
</body>

</html>
